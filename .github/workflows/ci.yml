name: Account-free CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # The suite is deliberately account-free. Keep these empty so a runner
      # cannot accidentally spend against a developer or repository secret.
      GEMINI_API_KEY: ""
      GOOGLE_API_KEY: ""
      OPENAI_API_KEY: ""
      NANOGHIBLI_ACCOUNT_FREE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install FFmpeg prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg

      - name: Install pinned Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.lock

      - name: Verify native prerequisites
        run: |
          ffmpeg -version | head -n 1
          python -c "import cv2; print('OpenCV', cv2.__version__)"

      - name: Check source syntax
        run: python -m compileall -q src tests

      - name: Check production imports
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import importlib

          modules = (
              "animator",
              "batch_stylizer",
              "director",
              "extractor",
              "image_grid",
              "main",
              "manual_chatgpt",
              "model_catalog",
              "models",
              "pull_batch_results",
              "sequence_trailer",
              "still_trailer",
              "stylizer",
              "submit_stills_batch",
              "trailer_frame_audit",
              "veo_animator",
          )
          for module in modules:
              importlib.import_module(module)
          print(f"Imported {len(modules)} production modules")
          PY

      - name: Run account-free tests
        env:
          PYTHONPATH: src
        run: python -m pytest --strict-config --strict-markers -q
