models:
  stylizer:
    name: "gemini-3.1-flash-image-preview"
    # Optional: spread image-generation calls across model-specific daily
    # buckets. CLI --stylizer_models overrides this list.
    # rotation:
    #   - "gemini-3.1-flash-image-preview"
    #   - "gemini-3-pro-image-preview-2k"
    #   - "gpt-image-1.5-high-fidelity"
    #   - "gemini-3-pro-image-preview"
    temperature: 0.7
    top_p: 0.95
    top_k: 40
  animator:
    name: "veo-3.1-fast-generate-preview"
    duration_seconds: "4"
    person_generation: "allow_adult"

processing:
  fps: 12.0
  motion_threshold: 20.0
  scene_threshold: 35.0
  max_duration: null
  max_workers: 4
  output_format: "mp4"
  skip_black_frames: false
  use_veo: false
  # Gemini Batch API for stylization (50% cost, async, 24h SLO).
  # CLI --batch overrides this. Veo is NOT supported by batch and stays sync.
  batch_enabled: false
  batch_poll_interval: 30       # seconds between client.batches.get polls
  batch_max_wait_hours: 24.0    # hard stop on how long to wait

# Google Cloud / Vertex AI (Gemini Enterprise Agent Platform)
# Configure this to use your Google Cloud project and $300 free trial credits.
google_cloud:
  use_vertexai: false           # Set to true to route inference to Vertex AI instead of AI Studio
  project: null                 # Your Google Cloud Project ID (e.g. "my-project-123" or set GOOGLE_CLOUD_PROJECT)
  location: "us-central1"       # Google Cloud region (or set GOOGLE_CLOUD_LOCATION)
  credentials: null             # Optional path to service account key JSON (or set GOOGLE_APPLICATION_CREDENTIALS)
